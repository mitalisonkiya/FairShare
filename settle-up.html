<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairShare — Settlement Optimization</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a href="index.html" class="logo">
        FAIRSHARE <span style="font-family:var(--font-mono); font-size:11px; color:var(--signal-green);">[FS]</span>
      </a>
      
      <div class="sidebar-section-label">// LEDGER WORKSPACE</div>
      <a class="nav-btn" href="dashboard.html">◈ Overview</a>
      <a class="nav-btn" href="groups.html">👥 My Groups</a>
      <a class="nav-btn" href="add-group.html">+ New Group</a>
      <a class="nav-btn" href="add-expense.html">💸 Record Expense</a>
      <a class="nav-btn" href="view-expenses.html">📜 Expense Logs</a>
      <a class="nav-btn active" href="settle-up.html">⚡ Settle Up</a>

      <div style="flex:1;"></div>
      <button class="nav-btn danger" onclick="logout()">⏻ Logout</button>
    </aside>

    <main class="main">
      <div class="header-row">
        <div>
          <h3>Settlement Engine</h3>
          <div class="small-muted">Minimum direct transfers to balance all group debts</div>
        </div>
        <div>
          <button class="btn secondary" onclick="loadSettlePage()">↻ Recalculate</button>
        </div>
      </div>

      <!-- Group Selection -->
      <div class="card" style="max-width:480px;">
        <div class="mono" style="font-size:11px;color:var(--signal-green);margin-bottom:6px;">// SELECT ACTIVE GROUP</div>
        <label class="small-muted">Group Ledger to Settle</label>
        <select id="settleGroupSelect"></select>
      </div>

      <!-- Suggested Wire Transfers -->
      <div>
        <div class="mono" style="font-size:11px;color:var(--ink-muted);margin-bottom:10px;text-transform:uppercase;">
          // Calculated Optimal Wire Paths
        </div>
        <div id="settleList" class="flex-col"></div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
  <script>
    loadSettlePage();
  </script>
</body>
</html>
