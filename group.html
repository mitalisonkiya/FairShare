<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FairShare — Group</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <div class="sidebar">
      <div class="logo">FairShare</div>
      <button class="nav-btn" onclick="window.location.href='groups.html'">Back</button>
      <div style="flex:1"></div>
      <button class="nav-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main">
      <div class="header-row"><div><h3 id="gp_title">Group</h3><div class="small-muted">Members & Expenses</div></div></div>

      <div class="card">
        <h4>Members</h4>
        <div id="memberList"></div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn" onclick="document.getElementById('mmodal').style.display='block'">Add Member</button>
          <button class="btn secondary" onclick="window.location.href='members.html'">View Members Page</button>
        </div>
      </div>


      <div class="card">
        <h4>Add Expense</h4>
        <input id="expName" placeholder="Expense title">
        <input id="expAmount" type="number" placeholder="Amount (₹)">
        <select id="expPaidBy"></select>
        <div class="flex" style="margin-top:8px"><button class="btn" onclick="addExpenseToActive()">Add Expense</button></div>
      </div>

      <div id="balanceBox" class="card"></div>

      <h4>Expenses</h4>
      <div id="expenseList"></div>
    </div>
  </div>

<!-- simple modal for add member -->
<div id="mmodal" style="display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.4);align-items:center;justify-content:center">
  <div style="background:#fff;color:#000;padding:20px;border-radius:8px;width:360px;margin:auto">
    <h3>Add Member</h3>
    <input id="memberName" placeholder="Member name">
    <input id="memberEmail" placeholder="Member email">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn" onclick="addMemberToActive();document.getElementById('mmodal').style.display='none'">Add</button>
      <button class="btn secondary" onclick="document.getElementById('mmodal').style.display='none'">Cancel</button>
    </div>
  </div>
</div>
<div><h3>Invite Member</h3>
<input type="email" id="inviteEmail" placeholder="Enter email">
<button onclick="sendInvite()">Send Invite</button>
</div>
<script src="script.js"></script>
<script> loadGroupDetails(); (function(){/* populate expPaidBy */ const gid=getActiveGroupId(); const g=getGroups().find(x=>x.id===gid); if(!g) return; document.getElementById('expPaidBy').innerHTML = (g.members||[]).map(m=>`<option value="${m.email}">${escapeHtml(m.name)} (${escapeHtml(m.email)})</option>`).join(''); })() </script>
</body>
</html>
