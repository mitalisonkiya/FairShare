<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FairShare — Add Expense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="logo">FairShare</div>
      <button class="nav-btn" onclick="window.location.href='groups.html'">Back</button>
      <div style="flex:1"></div>
      <button class="nav-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main">
      <h3>Add Expense</h3>
      <div class="card">
        <input id="expName" placeholder="Expense title">
        <input id="expAmount" type="number" placeholder="Amount (₹)">
        <select id="expPaidBy"></select>
        <div class="flex"><button class="btn" onclick="addExpenseToActive()">Add Expense</button></div>
      </div>

      <h4>Recent Expenses</h4>
      <div id="expenseList"></div>
    </div>
  </div>

<script src="script.js"></script>
<script>
  if(!requireAuthRedirect()){};
  (function(){
    const gid = getActiveGroupId(); const g = getGroups().find(x=>x.id===gid);
    if(!g){ alert("Select a group first"); window.location.href="groups.html"; return }
    document.getElementById("expPaidBy").innerHTML = (g.members||[]).map(m=>`<option value="${m.email}">${escapeHtml(m.name)} (${escapeHtml(m.email)})</option>`).join("");
    renderExpenses(); renderBalances();
  })();
</script>
</body>
</html>
