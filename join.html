<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join Group • FairShare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #4e54c8, #8f94fb);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            width: 90%;
            max-width: 450px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 20px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            animation: fadeIn 0.5s ease;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        #groupName {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        input {
            width: 100%;
            padding: 14px;
            border: none;
            outline: none;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #00c6ff;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
            transform: scale(1.03);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success {
            margin-top: 10px;
            font-size: 16px;
            color: #baffda;
        }

        .error {
            margin-top: 10px;
            font-size: 16px;
            color: #ffb3b3;
        }
    </style>
</head>

<body>

<h2>Joining group...</h2>
<script>
const urlParams = new URLSearchParams(window.location.search);
const groupId = urlParams.get("group");

if (!groupId) {
    document.body.innerHTML = "<h2>Invalid Invite Link</h2>";
} else {
    localStorage.setItem("fs_pending_join_group", groupId);
    window.location.href = "group.html";
}
</script>
</body>
</html>


</body>
</html>
