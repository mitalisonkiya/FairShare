<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FairShare — Login</title>
  <link rel="stylesheet" href="style.css">
  <style> body{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#4e54c8,#8f94fb)} </style>
</head>
<body>
  <div class="login-card">
    <h2>FairShare</h2>
    <p class="small-muted">Login to continue</p>
    <input id="li_email" type="email" placeholder="Email">
    <input id="li_password" type="password" placeholder="Password">
    <button class="btn" onclick="loginUser()">Login</button>
    <div class="links">
      <a class="small-muted" href="signup.html">Create account</a>
      <a class="small-muted" href="forgot-password.html">Forgot password?</a>
    </div>
  </div>
  <script>document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const res = await fetch("http://localhost:5000/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (data.success) {
        alert("Login Success");
        localStorage.setItem("user", JSON.stringify(data.user));
        window.location.href = "groups.html";
    } else {
        alert(data.message);
    }
});
</script>
<script src="script.js"></script>
</body>
</html>
