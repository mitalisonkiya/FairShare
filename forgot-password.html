<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FairShare — Reset Password</title>
  <link rel="stylesheet" href="style.css">
  <style> body{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#4e54c8,#8f94fb)} </style>
</head>
<body>
  <div class="login-card" style="width:520px">
    <h2>Reset Password</h2>
    <input id="fp_email" type="email" placeholder="Registered email">
    <button class="btn" onclick="startPasswordReset()">Find account</button>
    <div id="fp_status" class="small-muted" style="margin-top:12px"></div>
    <div id="fp_new_pw_area" style="display:none;margin-top:12px">
      <input id="fp_new_password" type="password" placeholder="New password">
      <input id="fp_new_password2" type="password" placeholder="Confirm new password">
      <input id="fp_index" type="hidden" value="">
      <button class="btn" onclick="finalizePasswordReset()">Set new password</button>
    </div>
    <div class="links"><a class="small-muted" href="login.html">Back to login</a></div>
  </div>
<script src="script.js"></script>
</body>
</html>
